<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="#0f172a"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  
  <!-- Waveform Bars -->
  <rect x="10" y="26" width="4" height="12" rx="2" fill="#38bdf8" filter="url(#glow)"/>
  <rect x="18" y="18" width="4" height="28" rx="2" fill="#38bdf8" filter="url(#glow)"/>
  <rect x="26" y="14" width="4" height="36" rx="2" fill="#10b981" filter="url(#glow)"/>
  <rect x="34" y="20" width="4" height="24" rx="2" fill="#10b981" filter="url(#glow)"/>
  <!-- Musical Note Accent -->
  <circle cx="43" cy="42" r="5" fill="url(#waveGrad)" filter="url(#glow)"/>
  <path d="M48 42 L48 18 C 48 16.5 49.5 15.2 51 15 L53 14.7 C54.5 14.5 56 15.6 56 17.2 L56 22 C53 20 50 20 48 21.5 Z" fill="url(#waveGrad)" filter="url(#glow)"/>
</svg>
